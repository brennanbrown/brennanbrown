name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    # Runs at 12am UTC
    - cron: '0 0 * * *'

jobs:
  update-readme:
    name: Update this repo's README
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          # NOTE: WakaTime API keys became write-only on 2026-11-01.
          # This secret must hold a personal OAuth token from
          # https://wakatime.com/oauth (paste it in place of the API key).
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: true
          TIME_RANGE: all_time
          SHOW_TIME: true
          LANG_COUNT: 6
          COMMIT_MESSAGE: Update README.md with WakaTime metrics
